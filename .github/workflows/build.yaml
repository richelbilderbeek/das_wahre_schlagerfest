# Builds the desktop and WebAssembly versions of the game.
# On the main branch, also publishes the website, with the
# WebAssembly version in it, so that 'docs/play.md' runs the actual game.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  QT_VERSION: 6.8.3
  # The Emscripten version that this version of Qt is built with, see
  # https://doc.qt.io/qt-6/wasm.html#installing-emscripten
  EMSCRIPTEN_VERSION: 3.1.56

jobs:
  build_desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq cmake ninja-build qt6-base-dev libgl1-mesa-dev libboost-test-dev libsfml-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@v4
        with:
          name: das_wahre_schlagerfest_desktop
          path: |
            build/das_wahre_schlagerfest
            build/das_wahre_schlagerfest_console

  build_wasm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq cmake ninja-build
          pip install aqtinstall

      # Building for WebAssembly needs the desktop Qt too, for its tools
      - name: Install Qt
        run: |
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 --outputdir "$HOME/Qt"
          aqt install-qt all_os wasm "$QT_VERSION" wasm_singlethread --outputdir "$HOME/Qt"
          # The cross-platform package does not keep the executable bits
          chmod +x "$HOME/Qt/$QT_VERSION/wasm_singlethread/bin/"*

      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"

      - name: Build
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          "$HOME/Qt/$QT_VERSION/wasm_singlethread/bin/qt-cmake" \
            -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$HOME/Qt/$QT_VERSION/gcc_64"
          cmake --build build

      - name: Collect the files a web server needs
        run: |
          mkdir game
          cp build/das_wahre_schlagerfest.html build/das_wahre_schlagerfest.js \
            build/das_wahre_schlagerfest.wasm build/qtloader.js build/qtlogo.svg game/

      - uses: actions/upload-artifact@v4
        with:
          name: das_wahre_schlagerfest_wasm
          path: game
          if-no-files-found: error

  # Adapted from https://zensical.org/docs/publish-your-site/#with-github-actions
  create_website:
    needs: [build_desktop, build_wasm]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: actions/download-artifact@v4
        with:
          name: das_wahre_schlagerfest_wasm
          path: docs/game
      - run: pip install zensical
      - run: zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
